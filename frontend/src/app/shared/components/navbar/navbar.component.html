<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Hartford Workers' Comp
    </a>
  </div>

  <div class="navbar-menu" *ngIf="authService.currentUser$ | async as user">
    <div class="nav-links" *ngIf="user.role === 'Admin'">
      <a routerLink="/admin/dashboard" routerLinkActive="active-link">Dashboard</a>
    </div>
    <div class="nav-links" *ngIf="user.role === 'Employer'">
      <a routerLink="/employer/dashboard" routerLinkActive="active-link">Dashboard</a>
    </div>
    <div class="nav-links" *ngIf="user.role === 'Surveyor'">
      <a routerLink="/surveyor/dashboard" routerLinkActive="active-link">Dashboard</a>
    </div>

    <div class="user-section">
      <span class="user-info">
        <span class="user-name">{{ user.fullName }}</span>
        <span class="user-role">{{ user.role }}</span>
      </span>
      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>

  <div class="navbar-menu" *ngIf="!(authService.currentUser$ | async)">
    <a routerLink="/login" class="nav-link" routerLinkActive="active-link">Login</a>
    <a routerLink="/register-employer" class="nav-link" routerLinkActive="active-link">Register</a>
  </div>
</nav>
